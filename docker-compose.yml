version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    environment:
      - DATABASE_URL=sqlite:///./mindtrace.db
      - SECRET_KEY=mindtrace-production-secret-key-2026
    volumes:
      - mindtrace_data:/app/data

volumes:
  mindtrace_data:
