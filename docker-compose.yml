version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=sqlite:///./mindtrace.db
    volumes:
      - mindtrace_data:/app/data

volumes:
  mindtrace_data:
