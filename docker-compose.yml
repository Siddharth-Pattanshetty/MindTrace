version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: docker/Dockerfile.backend
    ports:
      - "8000:8000"
    env_file:
      - backend/.env
    environment:
      - DATABASE_URL=sqlite:///./mindtrace.db
      - NEO4J_URI=bolt://neo4j:7687
      - NEO4J_USERNAME=neo4j
      - NEO4J_PASSWORD=mindtrace_password
      - NEO4J_DATABASE=neo4j
    volumes:
      - mindtrace_data:/app/data
    depends_on:
      - neo4j

  neo4j:
    image: neo4j:5-community
    container_name: mindtrace_neo4j
    ports:
      - "7474:7474" # HTTP Browser
      - "7687:7687" # Bolt Protocol
    environment:
      - NEO4J_AUTH=neo4j/mindtrace_password
      - NEO4J_PLUGINS=["apoc"]
    volumes:
      - neo4j_data:/data
      - neo4j_logs:/logs

volumes:
  mindtrace_data:
  neo4j_data:
  neo4j_logs:
